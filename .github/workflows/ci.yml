name: CI

# Every push and pull request: each extension builds from source, its tests
# and lints pass, and the registry it would publish is valid.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Anything that reaches the network after the vendor step is a bug we
  # want loud: every build below reads vendor/ and nothing else.
  CARGO_NET_OFFLINE: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Pinned by commit, like crc's own workflows.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the compiler and the wasm32 target; rustup,
      # already on the runner, installs them.
      #
      # The one step allowed to fetch, and only what Cargo.lock names,
      # checked against its checksums. The gate after it runs no dependency
      # code: it reads what cargo reports and stops a new build script or
      # proc macro before `cargo test` below would run it.
      - name: Vendor, then build scripts, proc macros, tree size
        env:
          CARGO_NET_OFFLINE: false
        run: ./scripts/vendor.sh
      - name: Format
        run: cargo fmt --all --check
      - name: Tests
        run: cargo test --locked
      - name: Lints
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --release --target wasm32-unknown-unknown -- -D warnings
      - name: Build every extension
        run: cargo build --locked --release --target wasm32-unknown-unknown
      - name: The registry is valid
        run: python3 scripts/build-registry.py
      # The manifest rules are crc's. The same accept and reject cases run
      # here through this repository's checks, and the copies here must be
      # crc's current ones: a rule changed on one side fails on the other.
      - name: The manifest contract matches crc
        run: |
          python3 scripts/build-registry.py --check-contract scripts/contract/manifests.json
          base=https://raw.githubusercontent.com/caioricciuti/crc/main/tests/fixtures/extensions/contract
          curl -fsSL --proto =https "$base/manifests.json" | diff -u - scripts/contract/manifests.json
          curl -fsSL --proto =https "$base/icons.txt" | diff -u - scripts/icons.txt
      # What a contributor starts from must build and pass the same checks.
      # Not --locked: the new package is not in Cargo.lock, by design. Still
      # offline against vendor/, so the only thing it can add to the lockfile
      # is its own path package.
      - name: The scaffold makes an extension that builds and validates
        run: |
          python3 scripts/new-extension.py --id ci.scaffold-check \
            --description "Checks the scaffold." --author CI --command "run:Run" </dev/null
          cargo test -p ci-scaffold-check
          cargo build --release --target wasm32-unknown-unknown -p ci-scaffold-check
          python3 scripts/build-registry.py --out "$RUNNER_TEMP/registry"
